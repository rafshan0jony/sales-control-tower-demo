<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="General Trade sales MIS: target vs achievement, sales, delivery, pending and insights." />
  <title>Demo Company — Sales Control Tower</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sales Tower" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card login-card-wide">
      <div class="login-brand">
        <div class="brand-logo login brand-text">Demo Company</div>
      </div>
      <h1>Select Your Role</h1>
      <p class="muted">Choose a position to explore the sales dashboard</p>
      <div id="role-options" class="role-grid">
        <button class="role-card" data-role="NATIONAL">
          <span class="role-ico">🏢</span>
          <span class="role-title">National Sales Manager</span>
          <span class="role-desc">Full company-wide view</span>
        </button>
        <button class="role-card" data-role="REGION">
          <span class="role-ico">🗺️</span>
          <span class="role-title">Regional Manager</span>
          <span class="role-desc">Region-level access</span>
        </button>
        <button class="role-card" data-role="AREA">
          <span class="role-ico">📍</span>
          <span class="role-title">Area Manager</span>
          <span class="role-desc">Area-level access</span>
        </button>
        <button class="role-card" data-role="TERRITORY">
          <span class="role-ico">🎯</span>
          <span class="role-title">Territory Officer</span>
          <span class="role-desc">Territory-level access</span>
        </button>
      </div>
      <div id="login-error" class="login-error hidden"></div>
      <p class="login-foot muted">Demo environment — no password required. All data is fictional.</p>
      <p class="login-credit">Developed by Rafshan Jony</p>
    </div>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo brand-text">Demo Company</div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="sync-pill" id="sync-pill">
          <span class="dot dot-gray"></span><span id="sync-text">Connecting…</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="nav-toggle" title="Menu">☰</button>
          <div class="breadcrumb" id="breadcrumb"></div>
        </div>
        <div class="topbar-right">
          <div class="date-filter">
            <select id="territory-select" class="select"></select>
            <select id="filter-select" class="select"></select>
            <div id="custom-range" class="custom-range hidden">
              <input type="date" id="filter-from" />
              <span>→</span>
              <input type="date" id="filter-to" />
            </div>
          </div>
          <div class="last-updated" id="last-updated"></div>
          <div class="user-menu">
            <button class="user-btn" id="user-btn">
              <span class="avatar" id="user-avatar"></span>
              <span class="user-meta">
                <span id="user-name">…</span>
                <span id="user-role" class="muted">…</span>
              </span>
            </button>
            <div class="user-dropdown hidden" id="user-dropdown">
              <button id="change-photo-btn">Change photo</button>
              <button id="change-password-btn">Change password</button>
              <button id="logout-btn">Sign out</button>
            </div>
          </div>
        </div>
      </header>
      <main id="app" class="app"></main>
    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>
  <div id="modal-root" class="modal-root"></div>

  <script src="/vendor/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js').catch(function () {});
      });
    }
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
